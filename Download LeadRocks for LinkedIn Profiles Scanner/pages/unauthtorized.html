<div class="lrck--content-unauth">
    <div class="lrck--enter-email">
        <div class="lrck--content-header">Sign in to LeadRocks</div>
        <form class="lrck--login-email">
            <input class="lrck--input" type="email" required placeholder="Enter your email here" />
            <button class="lrck--button-next" type="submit">Next</button>
        </form>
    </div>
    <div class="lrck--enter-pin lrck--hidden">
        <div class="lrck--content-header">A five-digit pin code was sent to:</div>
        <div class="lrck--content-description-bigger"></div>
        <form class="lrck--login-pin">
            <input class="lrck--input" type="text" required placeholder="Enter your pin here" />
            <button class="lrck--button-next" type="submit">Go</button>
            <div class="lrck--go-back lrck--flex">
                <svg class="lrck--arrow-left" color="#A771FE" width="16" viewBox="0 0 16 16" height="16" xmlns="http://www.w3.org/2000/svg" data-name="arrow_right">
                    <g>
                        <path
                            class="main-icon"
                            fill="#A771FE"
                            d="m12.24 8.998-3.88 3.225c-.42.36-.48.99-.13 1.41.36.42.99.48 1.41.13l6-4.995c.268-.257.363-.44.36-.77 0-.33-.09-.51-.36-.77l-6-5a1.01 1.01 0 0 0-1.41.13c-.35.42-.29 1.05.13 1.41l3.88 3.23H1a1 1 0 0 0 0 2h11.24Z"
                            fill-rule="evenodd"
                        ></path>
                    </g>
                </svg>
                <span>Go back</span>
            </div>
        </form>
    </div>
</div>
