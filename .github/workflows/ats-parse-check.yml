# THE CHECK THAT CANNOT RUN IN THE DEV CONTAINER.
#
# The container's egress policy denies open-resume.com, so the CV has
# only ever been checked against a local reimplementation of that
# parser's rules. A GitHub Actions runner has open egress, so this
# generates the DOCX the extension would produce, converts it to PDF the
# way a user does, uploads it to the live parser, and asserts what came
# back.
#
# The failure this exists to catch: Work Experience, Education and
# Skills all returning EMPTY because letter-spaced headings meant no
# section was ever detected.
name: ATS parse check

on:
  workflow_dispatch:
  push:
    paths:
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/**/*.js'
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/tests/**'
      - '.github/workflows/ats-parse-check.yml'

jobs:
  # WHAT GATES THE MERGE.
  #
  # Deterministic, offline, no third party involved. If this is red the
  # code is broken; if it is green the guarantees hold. Nothing in the
  # job below can fail the build, because nothing in it is under our
  # control.
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run every offline suite
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          pass=0; fail=0; failed=''
          for f in tests/*.test.cjs; do
            if out=$(node "$f" 2>&1); then
              pass=$((pass+1))
            else
              fail=$((fail+1)); failed="$failed$f"$'\n'
              echo "::group::FAILED $f"; echo "$out"; echo '::endgroup::'
            fi
          done
          echo "suites: $pass passed, $fail failed"
          echo "suites: $pass passed, $fail failed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "::error::$fail suite(s) failed:"; printf '%s' "$failed"; exit 1
          fi

  # ADVISORY ONLY, START TO FINISH.
  #
  # Every step here drives a website belonging to somebody else. It goes
  # down, it changes its markup, a runner loses DNS -- none of which says
  # anything about the CV, and all of which used to surface as the same
  # red X as a genuine regression. A check that cries wolf gets ignored,
  # and then the one time it means something it gets ignored too.
  #
  # So this job never fails. It reports what the live parsers returned
  # into the run summary, and distinguishes "the site was unreachable"
  # from "the site worked and the CV parsed wrong".
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the CV as .docx
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: node tests/ci/build-cv-docx.cjs

      - name: Convert to PDF the way a user does
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          soffice --headless --convert-to pdf cv.docx --outdir . >/dev/null 2>&1 || true
          ls -la cv.pdf
          echo "--- the PDF text layer, which is what a parser reads ---"
          pdftotext -layout cv.pdf - 2>/dev/null | head -40 || true

      # The script exits 0 for pass, 1 for a real regression, and 2 when
      # the site could not be reached or never showed our upload. Only
      # the middle one is about the CV.
      - name: Parse it on the live OpenResume
        id: liveparse
        continue-on-error: true
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          set +e
          node tests/ci/parse-on-openresume.mjs cv.pdf | tee live-parse.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Say what the live parser found
        if: always()
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          {
            echo "## Live ATS parse check (advisory)"
            echo ""
            case "${{ steps.liveparse.outputs.code }}" in
              0) echo "PASSED. Every live assertion held." ;;
              2) echo "SKIPPED. open-resume.com was unreachable or never rendered the"
                 echo "upload, so nothing was graded. This says nothing about the CV." ;;
              *) echo "REGRESSION. The parser worked and the CV came back wrong."
                 echo "This does not block the merge, but it is worth reading." ;;
            esac
            echo ""
            echo '```'
            sed -n '/=== THE ASSERTIONS ===/,$p' live-parse.log 2>/dev/null | head -40 \
              || sed -n '1,20p' live-parse.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the other parsers, reporting only
        if: always()
        continue-on-error: true
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          # Past the Bots is the one that matters most here: it is free,
          # needs no account, and simulates Workday, Greenhouse, Taleo,
          # Lever and iCIMS, whose own parsers publish nothing.
          node tests/ci/probe-parser.mjs https://pastthebots.com cv.pdf pastthebots
          node tests/ci/probe-parser.mjs https://jobloo.co cv.pdf jobloo
          node tests/ci/probe-parser.mjs https://www.yena.ai cv.pdf yena

      # THE VERDICT, LAST, WHERE IT CAN BE READ.
      #
      # The live-parse result is printed by step 8, and the three probe
      # steps after it dump ~70 lines of somebody else's landing page
      # each. Every log viewer shows the TAIL, so the one output that
      # matters was reliably scrolled off the end and the run had to be
      # judged by how long a step took. Re-printing it last costs nothing
      # and makes the answer the first thing visible.
      - name: The live parse verdict
        if: always()
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          echo '================ LIVE OPENRESUME VERDICT ================'
          case "${{ steps.liveparse.outputs.code }}" in
            0) echo 'PASSED - every live assertion held.' ;;
            2) echo 'SKIPPED - the site was unreachable or never rendered the'
               echo '          upload. Nothing was graded; this says nothing'
               echo '          about the CV.' ;;
            *) echo 'REGRESSION - the parser worked and the CV came back wrong.' ;;
          esac
          echo '--------------------------------------------------------'
          # `sed -n '/pat/,$p'` EXITS 0 WHEN IT MATCHES NOTHING, so the
          # `|| fallback` after it never ran and a SKIPPED run printed the
          # verdict with no reason under it -- twice. Print the head of the
          # log unconditionally instead; on a skip that head IS the reason.
          if grep -q '=== THE ASSERTIONS ===' live-parse.log 2>/dev/null; then
            sed -n '/=== WHAT THE LIVE PARSER EXTRACTED ===/,$p' live-parse.log
          else
            echo 'No assertions were reached. What the script reported:'
            head -25 live-parse.log 2>/dev/null || echo '(no log file)'
          fi
          echo '========================================================'

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-parse-evidence
          path: |
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.docx
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.pdf
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv-source.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-output.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-screenshot.png
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/probe-*.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/probe-*.png
          if-no-files-found: warn
