# THE CHECK THAT CANNOT RUN IN THE DEV CONTAINER.
#
# The container's egress policy denies open-resume.com, so the CV has
# only ever been checked against a local reimplementation of that
# parser's rules. A GitHub Actions runner has open egress, so this
# generates the DOCX the extension would produce, converts it to PDF the
# way a user does, uploads it to the live parser, and asserts what came
# back.
#
# The failure this exists to catch: Work Experience, Education and
# Skills all returning EMPTY because letter-spaced headings meant no
# section was ever detected.
name: ATS parse check

on:
  workflow_dispatch:
  push:
    paths:
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/docx-generator.js'
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/recruiter-audit.js'
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/tests/ci/**'
      - '.github/workflows/ats-parse-check.yml'

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the CV as .docx
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: node tests/ci/build-cv-docx.cjs

      - name: Convert to PDF the way a user does
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          soffice --headless --convert-to pdf cv.docx --outdir . >/dev/null 2>&1 || true
          ls -la cv.pdf
          echo "--- the PDF text layer, which is what a parser reads ---"
          pdftotext -layout cv.pdf - 2>/dev/null | head -40 || true

      # ADVISORY, NEVER BLOCKING.
      #
      # This drives a third-party website. It can be slow, change its
      # markup, or serve its own demo resume, and none of that is a
      # reason to stop a pull request merging. It reports; the offline
      # suites are what gate.
      - name: Parse it on the live OpenResume
        id: liveparse
        continue-on-error: true
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/ci/parse-on-openresume.mjs cv.pdf | tee live-parse.log

      - name: Say what the live parser found
        if: always()
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          {
            echo "## Live ATS parse check"
            echo ""
            if [ "${{ steps.liveparse.outcome }}" = "success" ]; then
              echo "All live assertions passed."
            else
              echo "Some live assertions did not pass. This does NOT block the merge:"
              echo "it drives a third-party site and is advisory. The offline suites gate."
            fi
            echo ""
            echo '```'
            sed -n '/=== THE ASSERTIONS ===/,$p' live-parse.log 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the other parsers, reporting only
        if: always()
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          # Past the Bots is the one that matters most here: it is free,
          # needs no account, and simulates Workday, Greenhouse, Taleo,
          # Lever and iCIMS, whose own parsers publish nothing.
          node tests/ci/probe-parser.mjs https://pastthebots.com cv.pdf pastthebots
          node tests/ci/probe-parser.mjs https://jobloo.co cv.pdf jobloo
          node tests/ci/probe-parser.mjs https://www.yena.ai cv.pdf yena

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-parse-evidence
          path: |
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.docx
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.pdf
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv-source.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-output.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-screenshot.png
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/probe-*.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/probe-*.png
          if-no-files-found: warn
