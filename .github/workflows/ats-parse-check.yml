# THE CHECK THAT CANNOT RUN IN THE DEV CONTAINER.
#
# The container's egress policy denies open-resume.com, so the CV has
# only ever been checked against a local reimplementation of that
# parser's rules. A GitHub Actions runner has open egress, so this
# generates the DOCX the extension would produce, converts it to PDF the
# way a user does, uploads it to the live parser, and asserts what came
# back.
#
# The failure this exists to catch: Work Experience, Education and
# Skills all returning EMPTY because letter-spaced headings meant no
# section was ever detected.
name: ATS parse check

on:
  workflow_dispatch:
  push:
    paths:
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/docx-generator.js'
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/recruiter-audit.js'
      - '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/tests/ci/**'
      - '.github/workflows/ats-parse-check.yml'

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreOffice
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build the CV as .docx
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: node tests/ci/build-cv-docx.cjs

      - name: Convert to PDF the way a user does
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        run: |
          soffice --headless --convert-to pdf cv.docx --outdir . >/dev/null 2>&1 || true
          ls -la cv.pdf
          echo "--- the PDF text layer, which is what a parser reads ---"
          pdftotext -layout cv.pdf - 2>/dev/null | head -40 || true

      - name: Parse it on the live OpenResume
        working-directory: '16-02-2026-3.0 ----- I LOVEEEEEEEEEE46'
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node tests/ci/parse-on-openresume.mjs cv.pdf

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-parse-evidence
          path: |
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.docx
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv.pdf
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/cv-source.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-output.txt
            16-02-2026-3.0 ----- I LOVEEEEEEEEEE46/parse-screenshot.png
          if-no-files-found: warn
