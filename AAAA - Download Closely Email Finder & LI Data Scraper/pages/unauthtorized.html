<div class="cly--content-unauth">
    <div class="cly--content-header">Sign in to Closely</div>
    <div class="cly--content-description">Please sign in to Closely to start using this extension. Or create an account if you don't have one. It's free 😊</div>

    <button class="cly--open-auth">Sign in</button>

    <div class="cly--auth-divider">
        <div class="cly--auth-divider-content">OR</div>
    </div>

    <button class="cly--google-auth">
        <div class="cly--google-logo cly--flex cly--flex-c">
            <svg class="cly--keep-color" color="#fff" width="16" viewBox="0 0 16 16" height="16" xmlns="http://www.w3.org/2000/svg" data-name="google">
                <g>
                    <path
                        fill="#FBBB00"
                        d="M3.538 9.646l-.556 2.075-2.03.043A7.946 7.946 0 0 1 0 7.98c0-1.323.322-2.571.892-3.67l1.809.331.792 1.797a4.744 4.744 0 0 0 .045 3.207z"
                        fill-rule="evenodd"
                    ></path>
                    <path
                        fill="#518EF8"
                        d="M15.823 6.49a7.99 7.99 0 0 1-.035 3.158 7.98 7.98 0 0 1-2.81 4.557l-2.278-.116-.322-2.012a4.757 4.757 0 0 0 2.047-2.43H8.157V6.49h7.666z"
                        fill-rule="evenodd"
                    ></path>
                    <path
                        fill="#28B446"
                        d="M12.977 14.205a7.948 7.948 0 0 1-4.996 1.758 7.98 7.98 0 0 1-7.03-4.2l2.587-2.117a4.746 4.746 0 0 0 6.84 2.43l2.6 2.129z"
                        fill-rule="evenodd"
                    ></path>
                    <path
                        fill="#F14336"
                        d="M13.076 1.837L10.49 3.954A4.747 4.747 0 0 0 3.493 6.44l-2.6-2.128A7.98 7.98 0 0 1 7.98 0c1.937 0 3.712.69 5.095 1.837z"
                        fill-rule="evenodd"
                    ></path>
                </g>
            </svg>
        </div>
        Sign in with Google
    </button>

    <div class="cly--no-account">
        Don't have an account yet?
        <a target="_blank" rel="noreferrer noopener" class="cly--open-signup">
            Sign Up
            <svg class="cly--arrow-right" color="#A771FE" width="14" viewBox="0 0 16 16" height="14" xmlns="http://www.w3.org/2000/svg" data-name="arrow_right">
                <g>
                    <path
                        class="main-icon"
                        fill="#A771FE"
                        d="m12.24 8.998-3.88 3.225c-.42.36-.48.99-.13 1.41.36.42.99.48 1.41.13l6-4.995c.268-.257.363-.44.36-.77 0-.33-.09-.51-.36-.77l-6-5a1.01 1.01 0 0 0-1.41.13c-.35.42-.29 1.05.13 1.41l3.88 3.23H1a1 1 0 0 0 0 2h11.24Z"
                        fill-rule="evenodd"
                    ></path>
                </g>
            </svg>
        </a>
    </div>
</div>
